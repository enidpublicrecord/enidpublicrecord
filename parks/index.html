function toast(msg){const el=document.getElementById('pulse');el.textContent=msg;el.classList.add('show');clearTimeout(window.__pt);window.__pt=setTimeout(()=>el.classList.remove('show'),1800)}
function initMap(){
 if(!window.L){toast('Map unavailable — the prototype UI still works.'); return;}
 document.documentElement.dataset.parksBuild='A6';
 map=L.map('map',{zoomControl:false,attributionControl:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false,preferCanvas:true}).setView([36.397,-97.885],12.9);
 let tileErrors=0, switched=false;
 // A3: key-free basemap path. CARTO removed after its 2026 API-key requirement.
 const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,keepBuffer:8,updateWhenIdle:false,updateWhenZooming:false,crossOrigin:true,attribution:'© OpenStreetMap contributors'});
 const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,keepBuffer:8,updateWhenIdle:false,updateWhenZooming:false,crossOrigin:true,attribution:'Tiles © Esri'});
 osm.on('tileerror',()=>{tileErrors++; if(tileErrors>=6&&!switched){switched=true; try{map.removeLayer(osm)}catch(e){} esri.addTo(map); toast('Switched to backup map source.'); setTimeout(()=>{map.invalidateSize(true); esri.redraw();},120);}});
 osm.addTo(map);
 trailGroup=L.layerGroup().addTo(map);
 markerGroup=L.layerGroup().addTo(map); renderMarkers();
 loadTrails();
 const repair=()=>{if(!map)return;map.invalidateSize(true); if(map.eachLayer)map.eachLayer(l=>{if(l.redraw)try{l.redraw()}catch(e){}})};
 requestAnimationFrame(repair); setTimeout(repair,180); setTimeout(repair,700); setTimeout(repair,1600);
 window.addEventListener('resize',()=>setTimeout(repair,120),{passive:true});
 if(window.visualViewport) visualViewport.addEventListener('resize',()=>setTimeout(repair,120),{passive:true});
}
function iconFor(p){return L.divIcon({className:'',html:`<div class="parkpin ${evidence?'evidence':''}"><span>${p.emoji}</span>${p.guide?'<b class="guidepin">🦉</b>':''}</div>`,iconSize:[34,34],iconAnchor:[17,31],tooltipAnchor:[0,-30]})}
function renderMarkers(){if(!markerGroup)return;markerGroup.clearLayers();markers.clear();filteredParks().forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:iconFor(p)}).addTo(markerGroup);m.bindTooltip(p.name,{direction:'top',offset:[0,-2]});m.on('click',()=>openPark(p));markers.set(p.id,m);});}
function filteredParks(){return filter==='All'?parks:parks.filter(p=>p.moods.includes(filter))}
function renderFilters(){const el=document.getElementById('filters');el.innerHTML=moods.map(([m,e])=>`<button class="chip ${m===filter?'active':''}" data-mood="${m}"><span class="em">${e}</span>${m}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.mood;if(filter==='Walk')setTrailsVisible(true);renderFilters();renderMarkers();toast(`${filteredParks().length} park${filteredParks().length===1?'':'s'} match ${filter.toLowerCase()}${filter==='Walk'?' • trails on':''}`)})}

const TRAIL_ENDPOINTS=[
 'https://gis.enid.org/server/rest/services/city/Enid_Transportation/MapServer/35/query',
 'https://gis.enid.org/server/rest/services/Enid_Trails/MapServer/33/query'
];
const TRAIL_SOURCE='https://gis.enid.org/server/rest/services/city/Enid_Transportation/MapServer/35';
const TRAIL_PLAN='https://www.enid.org/Services/Parks-Recreation/Enid-Master-Trails-Project';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function trailStatus(p={}){
 const d=String(p.Description||'').trim().toLowerCase(),s=[p.STATUS,p.PHASE2,p.Phase].filter(Boolean).join(' ').toLowerCase();
 if(d.includes('future')||d.includes('exploration')||s.includes('future')||s.includes('exploration'))return 'planned';
 if(d.includes('design complete')||s.includes('design'))return 'design';
 return 'existing';
}
function trailStatusLabel(kind){return kind==='design'?'Design / development':kind==='planned'?'Exploration / future':'Current trail category'}
function usefulTrailName(p={}){
 const vals=[p.TYPE,p.PHASE2,p.Phase].map(v=>String(v||'').trim()).filter(Boolean);
 const generic=/^(?:phase\s*\d*|existing|current|future|design|complete|exploration|pedestrian|bike|bicycle|trail|yes|no|n\/a|na|mixed use|shared use)$/i;
 const named=vals.find(v=>!generic.test(v)&&!/^\d+\s*(?:pedestrian|bike)/i.test(v));
 return named||'Enid trail segment';
}
function trailStyle(f){const k=trailStatus(f.properties||{});if(k==='design')return {color:'#d5962b',weight:4,opacity:.88,dashArray:'10 8',lineCap:'round'};if(k==='planned')return {color:'#567184',weight:3.5,opacity:.68,dashArray:'3 8',lineCap:'round'};return {color:'#1b6e4b',weight:5,opacity:.86,lineCap:'round'};}
function updateTrailLegend(){
 const el=document.getElementById('trailLegend'),count=document.getElementById('trailCount'),note=document.getElementById('trailSourceNote');if(!el)return;
 el.classList.toggle('off',!trailsVisible);el.classList.toggle('loading',!trailsLoaded&&!trailLoadFailed);
 if(trailLoadFailed){count.textContent='Unavailable';note.textContent='City trail feed could not be reached. Parks still work.';note.classList.add('trailError');return}
 if(!trailsLoaded){count.textContent='Loading…';note.textContent='Loading the City of Enid TrailMaster layer…';return}
 const c={existing:0,design:0,planned:0};trailFeatures.forEach(f=>c[trailStatus(f.properties||{})]++);
 count.textContent=`${trailFeatures.length} segments`;note.classList.remove('trailError');note.textContent=`${c.existing} current • ${c.design} design • ${c.planned} exploration/future`;
}
async function loadTrails(){
 if(!map||!trailGroup||trailsLoaded)return;trailLoadFailed=false;updateTrailLegend();
 const params=new URLSearchParams({where:'1=1',outFields:'OBJECTID,TYPE,LENGTH,LENGTH_MI,PARKS,SCHOOLS,COMMUNITY,PHASE2,YEAR_FIN,STATUS,width,Funding_Amount,Funding_Source,Mixed_Use,Phase,Description',returnGeometry:'true',outSR:'4326',f:'geojson'});
 for(const endpoint of TRAIL_ENDPOINTS){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
  try{
   const r=await fetch(endpoint+'?'+params.toString(),{mode:'cors',cache:'no-store',credentials:'omit',signal:controller.signal});if(!r.ok)throw new Error('HTTP '+r.status);
   const data=await r.json();if(!data||!Array.isArray(data.features)||!data.features.length)throw new Error('No trail features');
   clearTimeout(timer);renderTrails(data);trailsLoaded=true;trailLoadFailed=false;updateTrailLegend();return;
  }catch(e){clearTimeout(timer); /* try the publication-safe City fallback endpoint */ }
 }
 trailLoadFailed=true;updateTrailLegend();toast('Trail layer is temporarily unavailable. Parks still work.');
}
function renderTrails(data){
 trailGroup.clearLayers();trailLayers.clear();trailFeatures=data.features.filter(f=>f&&f.geometry);
 trailFeatures.forEach((f,i)=>{
  const p=f.properties||{},id=String(p.OBJECTID??i),group=L.geoJSON(f,{style:trailStyle});
  group.eachLayer(line=>{line.on('click',()=>openTrail(f,id));line.bindTooltip(usefulTrailName(p),{sticky:true,direction:'top'});});
  group.addTo(trailGroup);trailLayers.set(id,group);
 });
 if(!trailsVisible&&map.hasLayer(trailGroup))map.removeLayer(trailGroup);
}
function setTrailsVisible(on){trailsVisible=!!on;const b=document.getElementById('trailBtn');b?.classList.toggle('active',trailsVisible);if(map&&trailGroup){if(trailsVisible&&!map.hasLayer(trailGroup))trailGroup.addTo(map);if(!trailsVisible&&map.hasLayer(trailGroup))map.removeLayer(trailGroup)}updateTrailLegend();if(trailsVisible&&!trailsLoaded&&!trailLoadFailed)loadTrails()}
function toggleTrails(){setTrailsVisible(!trailsVisible);toast(trailsVisible?'Enid trails on':'Trails hidden')}
function fitTrail(id){const g=trailLayers.get(String(id));if(!map||!g)return;setTrailsVisible(true);const b=g.getBounds?.();if(b?.isValid())map.fitBounds(b.pad(.28),{paddingTopLeft:[30,220],paddingBottomRight:[30,180]})}
function trailField(label,value){if(value===null||value===undefined||String(value).trim()===''||String(value)==='0')return '';return `<div><b>${esc(label)}</b><span>${esc(value)}</span></div>`}
function openTrail(f,id){
 const p=f.properties||{},kind=trailStatus(p),name=usefulTrailName(p),miles=Number(p.LENGTH_MI),desc=String(p.Description||'').trim(),year=String(p.YEAR_FIN||'').trim();
 const meta=[Number.isFinite(miles)&&miles>0?trailField('GIS length',miles.toFixed(2)+' mi'):'',trailField('City GIS category',desc),trailField('Status field',p.STATUS),trailField('Phase',p.Phase||p.PHASE2),trailField('Year field',year),trailField('Mixed use',p.Mixed_Use)].filter(Boolean).join('');
 document.getElementById('sheetBody').innerHTML=`<div class="sheetHead"><div class="copy"><div class="kicker">City TrailMaster • EPR Parks A6</div><h2>${esc(name)}</h2><div class="addr">Enid trail network</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="tagrow"><span class="trailStatus ${kind}">🚶 ${trailStatusLabel(kind)}</span>${desc?`<span class="tag">${esc(desc)}</span>`:''}</div>${meta?`<div class="trailMeta">${meta}</div>`:''}<div class="trailCaution"><b>Status matters.</b> A6 preserves the City GIS distinction between current trail categories, design-complete/development segments, and exploration/future segments. A planned line is not presented as a trail you can necessarily walk today.</div>${evidence?`<div class="record"><div class="recordTop"><span>⌁</span><b>Public-record check</b></div><p>Geometry and segment attributes come from the City of Enid TrailMaster feature layer. EPR does not infer a named master-plan corridor or construction status beyond the published City fields.</p></div>`:''}<div class="sheetActions"><button class="sheetBtn primary" onclick="fitTrail('${esc(id)}')">Show segment</button><button class="sheetBtn" onclick="window.open(TRAIL_SOURCE,'_blank','noopener')">GIS source</button><button class="sheetBtn" onclick="window.open(TRAIL_PLAN,'_blank','noopener')">Trail plan</button></div>`;
 document.getElementById('sheet').classList.add('open');
}
function showTrailAbout(){
 const c={existing:0,design:0,planned:0};trailFeatures.forEach(f=>c[trailStatus(f.properties||{})]++);
 document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div style="display:flex;gap:8px;align-items:start"><div style="flex:1"><div class="eyebrow" style="color:#738078;opacity:1">Explore Enid on foot</div><h2>Enid trails</h2><p>${trailsLoaded?`${trailFeatures.length} City TrailMaster segments loaded.`:'The trail layer loads from the City of Enid public GIS.'}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="trailMeta">${trailField('Current category',c.existing)}${trailField('Design / development',c.design)}${trailField('Exploration / future',c.planned)}</div><div class="trailCaution"><b>How to read the map:</b> solid green lines are current TrailMaster categories; gold dashed lines are design/development; blue-gray dotted lines are exploration/future. Tap any line for the City GIS fields behind it.</div><div class="record"><div class="recordTop"><span>⌁</span><b>Names are evidence-controlled</b></div><p>Enid’s master plan includes named corridors, but A6 only displays a segment name when the live GIS attributes support one. EPR will not guess which named corridor a line belongs to.</p></div><div class="guideControls"><button class="guideBtn primary" onclick="window.open(TRAIL_PLAN,'_blank','noopener')">Master Trails Project</button><button class="guideBtn" onclick="window.open(TRAIL_SOURCE,'_blank','noopener')">City GIS layer</button></div>`;document.getElementById('modal').classList.add('open');
}

function openPark(p){
 const feats=p.features.slice(0,8).map(f=>`<div class="feature"><span>${featureIcons[f]||'•'}</span><strong>${f}</strong></div>`).join('');
 const isVisited=visited.has(p.id);
 document.getElementById('sheetBody').innerHTML=`<div class="sheetHead"><div class="copy"><div class="kicker">${evidence?'Evidence Lens on':'Park Explorer'}</div><h2>${p.name}</h2><div class="addr">${p.address} • Enid, Oklahoma</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="tagrow">${p.moods.map(x=>`<span class="tag">${x}</span>`).join('')}${p.guide?'<span class="guideBadge">🦉 Archie guide</span>':''}</div>${p.guide?`<button class="guidePromo" onclick="openGuide('${p.id}',0)"><span class="owl">🦉</span><span><strong>Walk with Archie</strong><small>A short, self-guided audio experience. No sign or QR scan required.</small></span></button>`:''}<div class="featureGrid">${feats}</div>${evidence?`<div class="record"><div class="recordTop"><span>⌁</span><b>Public-record check</b></div><p>${p.evidence}</p></div>`:''}<div class="sheetActions"><button class="sheetBtn primary" onclick="directions('${p.id}')">Directions</button><button class="sheetBtn ${isVisited?'visited':''}" id="visit-${p.id}" onclick="toggleVisited('${p.id}')">${isVisited?'✓ Explored':'Mark explored'}</button><button class="sheetBtn" onclick="window.open('${p.source}','_blank','noopener')">Source</button></div>`;
 document.getElementById('sheet').classList.add('open');
 if(map){map.flyTo([p.lat,p.lng],15,{duration:.7});setTimeout(()=>map.panBy([0,-120]),300)}
}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function toggleVisited(id){visited.has(id)?visited.delete(id):visited.add(id);localStorage.setItem('epr-parks-visited',JSON.stringify([...visited]));updatePassport();const p=parks.find(x=>x.id===id);openPark(p);toast(visited.has(id)?'Added to your Park Passport':'Removed from Park Passport')}
function updatePassport(){document.getElementById('passportText').textContent=`${visited.size} of ${parks.length} mapped parks explored`;document.getElementById('progressBar').style.width=`${Math.round(visited.size/parks.length*100)}%`}
function directions(id){const p=parks.find(x=>x.id===id);window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.lat+','+p.lng)}`,'_blank','noopener')}
function showBrowse(passportOnly=false){const list=(passportOnly?parks.filter(p=>visited.has(p.id)):filteredParks());document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div style="display:flex;align-items:start;gap:8px"><div style="flex:1"><div class="eyebrow" style="color:#738078;opacity:1">${passportOnly?'My Park Passport':'Browse'}</div><h2>${passportOnly?'Places I’ve explored':'Choose your next park'}</h2><p>${passportOnly?'Your visit list stays in this browser on this device.':`${parks.length} EPR-mapped park sites are loaded. Amenity details are only shown where they have been reconciled.`}</p></div><button class="close" onclick="closeModal()">×</button></div>${passportOnly?'':`<div class="search"><input id="parkSearch" placeholder="Search parks or activities" /><button class="dockBtn primary" style="width:82px" onclick="renderParkList()">Find</button></div>`}<div class="parklist" id="parkList"></div><div class="note">A6 currently loads 19 EPR-mapped park sites plus the City TrailMaster network. The City describes a broader parks/recreation system, so this number is a mapped-app inventory—not a claim that Enid has only 19 parks or recreation areas.</div>`;document.getElementById('modal').classList.add('open');renderParkList(passportOnly)}
function renderParkList(passportOnly=false){const q=(document.getElementById('parkSearch')?.value||'').trim().toLowerCase();let list=passportOnly?parks.filter(p=>visited.has(p.id)):filteredParks().filter(p=>!q||[p.name,p.address,...p.features,...p.moods].join(' ').toLowerCase().includes(q));const el=document.getElementById('parkList');if(!el)return;el.innerHTML=list.length?list.map(p=>`<div class="parkrow"><div class="dot">${p.emoji}</div><div class="pcopy"><strong>${p.name}</strong><small>${p.moods.slice(0,4).join(' • ')}</small></div><button onclick="closeModal();openPark(parks.find(x=>x.id==='${p.id}'))">Open</button></div>`).join(''):`<div class="parkrow"><div class="pcopy"><strong>No parks here yet.</strong><small>${passportOnly?'Mark a park as explored to start your Passport.':'Try another search or activity.'}</small></div></div>`}
function closeModal(){document.getElementById('modal').classList.remove('open');stopNarration()}
function showAbout(){document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div style="display:flex;gap:8px;align-items:start"><div style="flex:1"><div class="eyebrow" style="color:#738078;opacity:1">Prototype A6</div><h2>Parks, trails—and receipts.</h2></div><button class="close" onclick="closeModal()">×</button></div><p>EPR Parks is designed to answer three questions at once: <b>“Where can I go?”</b>, <b>“How can I explore it?”</b>, and <b>“What does the public record actually verify?”</b></p><div class="record"><div class="recordTop"><span>🚶</span><b>Trail layer</b></div><p>A6 loads the City of Enid TrailMaster polyline layer and keeps current, design/development, and exploration/future segments visually distinct. Tap a trail line to inspect its published GIS fields.</p></div><div class="record"><div class="recordTop"><span>⌁</span><b>Evidence Lens</b></div><p>Turn it on to surface plain-language ownership and mapping notes beside recreation information. Public-facing evidence stays concise; internal research workflow stays private.</p></div><div class="record" style="background:#eef6ef;border-color:#d3e6d6"><div class="recordTop"><span>✓</span><b>Privacy-first Park Passport</b></div><p>Visited parks and Archie guide progress are stored locally on this device. No account is needed.</p></div><p class="note">Independent EPR prototype. Not an official City of Enid app. A6 adds the City trail network while preserving Archie’s digital guide, QR-ready deep links, and the A4 mobile map-layout fix. Production Atlas is not touched.</p>`;document.getElementById('modal').classList.add('open')}

const guideData={
 meadowlake:{title:'Meadowlake Mini Walk',subtitle:'3 stops • digital beta',stops:[
  {title:'Water + walking',text:'Meadowlake Park brings several kinds of recreation into one place. The City currently lists a lake or river, paved walking trails, picnic areas, a playground, a rotunda, sports space, toilets, and water fountains here. As you walk, notice how many different activities share this public space.'},
  {title:'A recreation hub',text:'The City also lists shaded areas, a sports pavilion, barbecue facilities, and youth activity space at Meadowlake. Archie’s Guide is designed to keep the first layer short, then let you open the park card or source when you want the deeper record.'},
  {title:'See the record',text:'EPR maps Meadowlake as a verified park site with a supported public-record parcel crosswalk. A containing parcel and the everyday park footprint are not automatically the same thing. That distinction is why the Evidence Lens stays separate from the recreation guide.'}
 ]},
 crosslin:{title:'Crosslin Quick Guide',subtitle:'2 stops • digital beta',stops:[
  {title:'Trail, water, play',text:'Crosslin Park is currently listed with a lake or river, paved walking trails, a playground, picnic tables, grassed sports areas, a sports pavilion, toilets, and water fountains. This stop is a quick orientation before you choose your own route.'},
  {title:'Verified place',text:'EPR’s asset map has exact current City parcel matches for the mapped Crosslin property records. The guide tells you what is here; the Evidence Lens tells you what the public record supports.'}
 ]},
 govnorth:{title:'Government Springs North',subtitle:'2 stops • digital beta',stops:[
  {title:'Start at the park',text:'Government Springs North is currently listed with a lake or river, a playground, rotunda, paved walking trails, picnic tables, barbecue facilities, toilets, water fountains, and accessible features. Use this first stop as your orientation point.'},
  {title:'Why EPR shows a caution',text:'EPR has an exact-current City parcel anchor at this park site, but the anchor is not treated as proof that one parcel equals the full park footprint. That is a small example of what the Verify layer is for.'}
 ]},
 weldon:{title:'Weldon Quiet Stop',subtitle:'2 stops • digital beta',stops:[
  {title:'Bird sanctuary',text:'The City identifies this place as Weldon Park and Bird Sanctuary and currently lists shade areas here. This guide intentionally stays quiet and simple: look around, listen, and use the map rather than turning the park into a screen experience.'},
  {title:'Mapped carefully',text:'EPR has a verified City parcel anchor at the South Lincoln site. Nearby City property is not silently added to the sanctuary footprint without a positive record bridge. Tap Source if you want to see where the public-facing record begins.'}
 ]}
};
const guideSeen=new Set(JSON.parse(localStorage.getItem('epr-parks-guide-seen')||'[]'));
let guideParkId=null,guideStopIndex=0,voices=[];
function guideUrl(id,idx){const u=new URL(location.href);u.hash='';u.search='';u.searchParams.set('guide',id);u.searchParams.set('stop',String(idx+1).padStart(2,'0'));return u.toString()}
function loadVoices(){if(!('speechSynthesis' in window))return;voices=speechSynthesis.getVoices().filter(v=>/^en\b/i.test(v.lang)||/English/i.test(v.name));const sel=document.getElementById('guideVoice');if(!sel)return;const saved=localStorage.getItem('epr-parks-guide-voice')||'';sel.innerHTML=(voices.length?voices:[{name:'Device default',voiceURI:'',lang:'en'}]).map((v,i)=>`<option value="${i}" ${v.voiceURI===saved?'selected':''}>${v.name}${v.lang?' · '+v.lang:''}</option>`).join('');sel.onchange=()=>{const v=voices[Number(sel.value)];if(v)localStorage.setItem('epr-parks-guide-voice',v.voiceURI||'')};}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,250)}
function stopNarration(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function speakGuide(id,idx){stopNarration();const g=guideData[id];if(!g)return;if(!('speechSynthesis' in window)){toast('Speech playback is not available on this device.');return}const s=new SpeechSynthesisUtterance(g.stops[idx].text);s.rate=.94;s.pitch=1.03;const sel=document.getElementById('guideVoice');const v=voices[Number(sel?.value||0)];if(v)s.voice=v;s.lang=v?.lang||'en-US';speechSynthesis.speak(s)}
function markGuideSeen(id,idx){guideSeen.add(`${id}:${idx}`);localStorage.setItem('epr-parks-guide-seen',JSON.stringify([...guideSeen]));toast('Guide stop saved on this device');openGuide(id,idx)}
function openGuideHub(){stopNarration();const entries=Object.entries(guideData);document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div style="display:flex;align-items:start;gap:8px"><div style="flex:1"><div class="eyebrow" style="color:#738078;opacity:1">🦉 Archie’s Guide · A6 beta</div><h2>There’s a story here.</h2><p>Start a self-guided stop from the map. QR codes are already supported, but no physical sign is required.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="digitalOnly"><b>Digital-first:</b> EPR is not assuming permission to place signs in City parks. Every guide works from the app itself; a QR is simply another way to open the same permanent stop later.</div><div class="guideHubList">${entries.map(([id,g])=>{const p=parks.find(x=>x.id===id);const done=g.stops.filter((_,i)=>guideSeen.has(`${id}:${i}`)).length;return `<div class="guideHubRow"><div class="owlMini">🦉</div><div class="gcopy"><strong>${p?.name||g.title}</strong><small>${g.stops.length} stops · ${done}/${g.stops.length} heard/saved</small></div><button onclick="openGuide('${id}',0)">Start</button></div>`}).join('')}</div><div class="note">Prototype narration uses your device’s built-in English speech voice. Produced Darian audio—or a dedicated Archie voice—can replace it later without changing the stop URL or QR code.</div>`;document.getElementById('modal').classList.add('open')}
function openGuide(id,idx=0){stopNarration();const g=guideData[id],p=parks.find(x=>x.id===id);if(!g||!p){toast('This park does not have an Archie guide yet.');return}idx=Math.max(0,Math.min(g.stops.length-1,Number(idx)||0));guideParkId=id;guideStopIndex=idx;const st=g.stops[idx],seen=guideSeen.has(`${id}:${idx}`);document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div class="guideHero"><div class="guideHeroTop"><div class="archie">🦉</div><div style="min-width:0;flex:1"><div class="eyebrow">Archie’s Guide · stop ${idx+1} of ${g.stops.length}</div><h2>${st.title}</h2><p>${p.name} · ${g.subtitle}</p></div><button class="close" style="background:rgba(255,255,255,.14);color:#fff" onclick="closeModal();stopNarration()">×</button></div><div class="stopProgress">${g.stops.map((_,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div></div><div class="guideStory">${st.text}</div><div class="voiceRow"><label>ARCHIE VOICE</label><select id="guideVoice"><option>Device voice</option></select></div><div class="guideControls"><button class="guideBtn primary" onclick="speakGuide('${id}',${idx})">▶ Hear this stop</button><button class="guideBtn" onclick="stopNarration()">■ Stop</button></div><div class="guideNav"><button class="guideBtn" ${idx===0?'disabled':''} onclick="openGuide('${id}',${idx-1})">← Previous</button><button class="guideBtn ${seen?'gold':''}" onclick="markGuideSeen('${id}',${idx})">${seen?'✓ Saved':'Save stop'}</button><button class="guideBtn" ${idx===g.stops.length-1?'disabled':''} onclick="openGuide('${id}',${idx+1})">Next →</button></div><div class="guideNav"><button class="guideBtn" onclick="showGuideQR('${id}',${idx})">▦ QR / link</button><button class="guideBtn" onclick="closeModal();openPark(parks.find(x=>x.id==='${id}'))">Park card</button><button class="guideBtn" onclick="directions('${id}')">Directions</button></div><div class="note">Guide facts are intentionally concise. Use the park card and Evidence Lens for source-backed detail. Physical signage is not required for this guide to work.</div>`;document.getElementById('modal').classList.add('open');loadVoices();if(map){map.flyTo([p.lat,p.lng],15,{duration:.55})}}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Guide link copied')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Guide link copied')}}
function showGuideQR(id,idx){stopNarration();const g=guideData[id],p=parks.find(x=>x.id===id),url=guideUrl(id,idx);document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div style="display:flex;gap:8px;align-items:start"><div style="flex:1"><div class="eyebrow" style="color:#738078;opacity:1">QR-ready stop</div><h2>${p.name}</h2><p>${g.stops[idx].title} · stop ${idx+1}</p></div><button class="close" onclick="openGuide('${id}',${idx})">×</button></div><div class="qrWrap"><div class="qrCard"><canvas id="guideQR" width="220" height="220"></canvas></div></div><div class="urlBox">${url}</div><div class="guideControls"><button class="guideBtn primary" onclick="copyText(${JSON.stringify('URLTOKEN')})">Copy stop link</button><button class="guideBtn" onclick="shareGuide('${id}',${idx})">Share</button></div><div class="digitalOnly"><b>No sign required.</b> This QR can live on EPR’s website, a printable guide, social graphic, event handout, or—only with permission—a future physical marker.</div>`;document.getElementById('modal').classList.add('open');const btn=document.querySelector('.guideControls .guideBtn.primary');if(btn)btn.onclick=()=>copyText(url);const c=document.getElementById('guideQR');if(window.QRCode?.toCanvas){QRCode.toCanvas(c,url,{width:220,margin:1,color:{dark:'#123328',light:'#ffffff'}},err=>{if(err)qrFallback(c,url)})}else qrFallback(c,url)}
function qrFallback(c,url){const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,220,220);x.fillStyle='#123328';x.font='700 15px system-ui';x.textAlign='center';x.fillText('QR library unavailable',110,96);x.font='12px system-ui';x.fillText('Use Copy stop link',110,120);}
async function shareGuide(id,idx){const p=parks.find(x=>x.id===id),url=guideUrl(id,idx);if(navigator.share){try{await navigator.share({title:`${p.name} · Archie’s Guide`,text:'Open this EPR Parks guide stop.',url});return}catch(e){}}copyText(url)}
function openDeepGuide(){const q=new URLSearchParams(location.search),id=q.get('guide');if(!id||!guideData[id])return;let n=parseInt(q.get('stop')||'1',10);if(!Number.isFinite(n))n=1;setTimeout(()=>openGuide(id,n-1),850)}

function locate(){if(!navigator.geolocation){toast('Location is not available in this browser.');return}navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];if(map){if(userMarker)userMarker.remove();userMarker=L.circleMarker(ll,{radius:8,weight:3,color:'#153e2d',fillColor:'#f1c55f',fillOpacity:1}).addTo(map).bindTooltip('You are here');map.flyTo(ll,14)}toast('Location found — tap a park to explore.')},()=>toast('Location permission was not granted.'),{enableHighAccuracy:true,timeout:10000})}
function surprise(){const list=filteredParks();const p=list[Math.floor(Math.random()*list.length)];openPark(p);toast(`Try ${p.name}`)}
function fitAll(){if(!map)return;const list=filteredParks();map.fitBounds(L.latLngBounds(list.map(p=>[p.lat,p.lng])).pad(.14),{paddingTopLeft:[25,240],paddingBottomRight:[25,160]})}
function toggleEvidence(){evidence=!evidence;document.getElementById('evidenceBtn').classList.toggle('active',evidence);renderMarkers();toast(evidence?'Evidence Lens on':'Evidence Lens off');if(document.getElementById('sheet').classList.contains('open'))closeSheet()}
function collapseHero(){const h=document.getElementById('hero'),f=document.getElementById('filters');const hidden=h.dataset.hidden==='1';h.dataset.hidden=hidden?'0':'1';h.style.transform=hidden?'translateY(0)':'translateY(-190px)';f.style.top=hidden?'calc(var(--safe-top) + 245px)':'calc(var(--safe-top) + 70px)';document.getElementById('collapseHero').textContent=hidden?'Map first':'Show intro'}
document.getElementById('nearBtn').onclick=locate;document.getElementById('trailBtn').onclick=toggleTrails;document.getElementById('trailLegendBtn').onclick=showTrailAbout;document.getElementById('guideBtn').onclick=openGuideHub;document.getElementById('surpriseBtn').onclick=surprise;document.getElementById('collapseHero').onclick=collapseHero;document.getElementById('evidenceBtn').onclick=toggleEvidence;document.getElementById('fitBtn').onclick=fitAll;document.getElementById('browseBtn').onclick=()=>showBrowse(false);document.getElementById('passportBtn').onclick=()=>showBrowse(true);document.getElementById('searchBtn').onclick=()=>showBrowse(false);document.getElementById('aboutBtn').onclick=showAbout;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
renderFilters();updatePassport();updateTrailLegend();initMap();openDeepGuide();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
