<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynpZjqMZV9A6TkFYu7S9pAPQmZxI=" crossorigin="" />
<style>
:root{
  --ink:#13221d; --muted:#68766f; --paper:#f7f4ed; --card:rgba(255,255,255,.96);
  --leaf:#2d7b53; --leaf2:#73ad76; --mint:#dceedd; --sun:#f0bc52; --blue:#2d748a;
  --line:#d8ddd8; --shadow:0 14px 40px rgba(25,47,37,.18); --safe-top:max(10px,env(safe-area-inset-top));
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
button,input{font:inherit} button{cursor:pointer}
#map{position:fixed;inset:0;background:
  radial-gradient(circle at 16% 18%,rgba(115,173,118,.16),transparent 22%),
  radial-gradient(circle at 78% 72%,rgba(45,116,138,.13),transparent 25%),
  linear-gradient(135deg,#f7f2e8,#edf4e8)}
#map:before{content:"";position:absolute;inset:0;opacity:.34;pointer-events:none;background-image:linear-gradient(35deg,transparent 47%,rgba(110,120,111,.14) 48%,rgba(110,120,111,.14) 49%,transparent 50%),linear-gradient(115deg,transparent 47%,rgba(110,120,111,.10) 48%,rgba(110,120,111,.10) 49%,transparent 50%);background-size:110px 110px,150px 150px}
.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.82)!important}
.leaflet-control-zoom{display:none}
.topbar{position:fixed;z-index:1000;left:10px;right:10px;top:var(--safe-top);height:58px;border:1px solid rgba(210,218,211,.95);border-radius:16px;background:rgba(255,255,255,.94);box-shadow:0 6px 22px rgba(25,47,37,.13);backdrop-filter:blur(13px);display:flex;align-items:center;gap:9px;padding:7px 8px}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 1px #d7ddd8;flex:0 0 auto}
.brand{min-width:0;flex:1}.brand strong{display:block;font-size:15px;letter-spacing:-.02em;line-height:1}.brand span{display:block;margin-top:5px;font-size:9.5px;color:var(--muted);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border:0;border-radius:12px;background:#f3f5f2;color:var(--ink);display:grid;place-items:center;font-weight:900}
.hero{position:fixed;z-index:850;left:10px;right:10px;top:calc(var(--safe-top) + 70px);background:linear-gradient(145deg,rgba(18,51,40,.96),rgba(34,84,61,.95));color:white;border-radius:22px;padding:15px 15px 14px;box-shadow:var(--shadow);overflow:hidden}
.hero:after{content:"";position:absolute;width:150px;height:150px;right:-60px;top:-75px;border-radius:50%;background:radial-gradient(circle,rgba(240,188,82,.46),rgba(240,188,82,0) 68%)}
.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;opacity:.72}
.hero h1{font-size:26px;line-height:.98;letter-spacing:-.045em;margin:5px 0 6px;max-width:270px}.hero p{font-size:11px;line-height:1.35;margin:0;color:rgba(255,255,255,.78);max-width:305px}
.quickrow{display:flex;gap:7px;margin-top:12px;position:relative;z-index:1}.heroBtn{height:38px;border-radius:999px;border:0;padding:0 12px;font-weight:900;font-size:11px}.heroBtn.primary{background:white;color:#163428}.heroBtn.gold{background:#f1c55f;color:#293220}.heroBtn.ghost{background:rgba(255,255,255,.11);color:white;border:1px solid rgba(255,255,255,.2)}
.filters{position:fixed;z-index:870;left:10px;right:10px;top:calc(var(--safe-top) + 245px);display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;border:1px solid rgba(203,211,204,.95);border-radius:999px;background:rgba(255,255,255,.95);padding:0 12px;font-size:10.5px;font-weight:850;box-shadow:0 3px 11px rgba(25,47,37,.10);color:#32433b}.chip.active{background:#163e2e;color:white;border-color:#163e2e}.chip .em{margin-right:5px}
.floatstack{position:fixed;z-index:900;right:11px;bottom:164px;display:grid;gap:8px}.floatbtn{width:47px;height:47px;border:1px solid #d3dad4;border-radius:15px;background:rgba(255,255,255,.96);box-shadow:0 5px 16px rgba(25,47,37,.14);display:grid;place-items:center;font-size:19px}.floatbtn.active{background:#153e2d;color:white;border-color:#153e2d}
.dock{position:fixed;z-index:1000;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));border:1px solid rgba(209,216,210,.98);background:rgba(255,255,255,.97);border-radius:20px;box-shadow:var(--shadow);padding:11px 11px 12px;backdrop-filter:blur(14px)}
.dockTop{display:flex;align-items:center;gap:9px}.passport{flex:1;min-width:0}.passport .label{font-size:9px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#728078}.passport strong{display:block;font-size:14px;margin-top:2px;letter-spacing:-.02em}.progress{width:98px;height:8px;background:#e6ebe6;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2e7952,#74ab77);border-radius:999px;transition:.2s}.dockBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.dockBtn{height:42px;border-radius:12px;border:1px solid #cfd6d0;background:#fff;font-weight:900;font-size:11px;color:#263a31}.dockBtn.primary{background:#163e2e;color:#fff;border-color:#163e2e}
.parkpin{width:34px;height:34px;border-radius:50% 50% 50% 10%;transform:rotate(-45deg);background:#2f8057;border:3px solid rgba(255,255,255,.94);box-shadow:0 4px 10px rgba(20,44,33,.28);display:grid;place-items:center}.parkpin span{transform:rotate(45deg);font-size:15px}.parkpin.evidence{background:#163e2e;box-shadow:0 0 0 5px rgba(240,188,82,.42),0 4px 10px rgba(20,44,33,.28)}
.leaflet-marker-icon{background:transparent!important;border:0!important}
.leaflet-tooltip{border:0!important;border-radius:10px!important;padding:6px 8px!important;box-shadow:0 5px 16px rgba(25,47,37,.16)!important;font-size:10px!important;font-weight:850!important;color:#24372e!important}
.sheet{position:fixed;z-index:1300;left:8px;right:8px;bottom:8px;max-height:78dvh;overflow:auto;background:#fff;border:1px solid #d0d7d1;border-radius:23px;box-shadow:0 22px 60px rgba(18,44,33,.30);padding:10px 13px 14px;transform:translateY(calc(100% + 20px));transition:.24s cubic-bezier(.2,.8,.2,1)}.sheet.open{transform:translateY(0)}
.handle{width:42px;height:4px;background:#d8ded9;border-radius:99px;margin:1px auto 10px}.sheetHead{display:flex;gap:9px;align-items:flex-start}.sheetHead .copy{min-width:0;flex:1}.sheetHead .kicker{font-size:9px;font-weight:950;letter-spacing:.1em;color:#6e7a74;text-transform:uppercase}.sheetHead h2{margin:3px 0 3px;font-size:24px;line-height:1;letter-spacing:-.04em}.sheetHead .addr{font-size:11px;color:#6a7770}.close{border:0;background:#f1f4f1;width:36px;height:36px;border-radius:11px;font-size:21px}.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.tag{font-size:9.5px;font-weight:850;border-radius:999px;background:#edf5ed;border:1px solid #d6e6d7;padding:5px 8px}.featureGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.feature{min-height:58px;padding:9px;border:1px solid #e1e5e1;border-radius:13px;background:#fbfcfa}.feature span{font-size:16px}.feature strong{display:block;font-size:10.5px;line-height:1.15;margin-top:4px}.record{margin-top:12px;border-radius:14px;background:#f6f2e6;border:1px solid #eadcb8;padding:10px 11px}.recordTop{display:flex;align-items:center;gap:7px}.recordTop b{font-size:11px}.record p{font-size:10px;line-height:1.38;margin:5px 0 0;color:#5c655f}.sheetActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}.sheetBtn{height:42px;border:1px solid #cfd7d0;border-radius:11px;background:#fff;font-size:10px;font-weight:900}.sheetBtn.primary{background:#163e2e;color:#fff;border-color:#163e2e}.sheetBtn.visited{background:#e6f3e8;color:#245b3e;border-color:#bcd8c3}
.modal{position:fixed;z-index:1400;inset:0;background:rgba(16,33,26,.42);display:none;align-items:flex-end;padding:8px}.modal.open{display:flex}.modalCard{width:100%;max-height:76dvh;overflow:auto;background:#fff;border-radius:24px;padding:11px 13px 16px;box-shadow:0 20px 60px rgba(18,44,33,.32)}.modalCard h2{font-size:23px;margin:4px 0 3px;letter-spacing:-.04em}.modalCard>p{font-size:11px;color:#69766f;line-height:1.4}.search{display:flex;gap:7px;margin-top:10px}.search input{flex:1;min-width:0;height:42px;border:1px solid #cbd3cc;border-radius:12px;padding:0 11px;font-size:16px}.parklist{display:grid;gap:7px;margin-top:10px}.parkrow{border:1px solid #e0e5e0;border-radius:14px;padding:10px;display:flex;align-items:center;gap:9px;background:#fff}.parkrow .dot{width:35px;height:35px;border-radius:12px;background:#e4f0e4;display:grid;place-items:center;flex:0 0 auto}.parkrow .pcopy{min-width:0;flex:1}.parkrow strong{font-size:12px;display:block}.parkrow small{font-size:9.5px;color:#6f7a74}.parkrow button{border:0;background:#153e2d;color:#fff;border-radius:10px;height:34px;padding:0 10px;font-weight:850;font-size:10px}
.note{font-size:9px;color:#758079;line-height:1.35;margin-top:9px}.pulse{position:fixed;z-index:820;left:50%;transform:translateX(-50%);bottom:174px;background:rgba(20,50,38,.92);color:white;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:850;opacity:0;pointer-events:none;transition:.2s}.pulse.show{opacity:1}
@media(min-width:760px){.hero{right:auto;width:390px}.filters{right:auto;width:620px}.dock{left:50%;right:auto;transform:translateX(-50%);width:620px}.sheet,.modalCard{left:50%;right:auto;width:520px;margin-left:auto;margin-right:auto}.floatstack{right:calc(50% - 305px)}}

/* A2 phone-preview resilience */
.filters{mask-image:linear-gradient(to right,transparent 0,#000 10px,#000 calc(100% - 26px),transparent 100%);-webkit-mask-image:linear-gradient(to right,transparent 0,#000 10px,#000 calc(100% - 26px),transparent 100%);padding-left:6px;padding-right:18px}
.leaflet-tile-container img{image-rendering:auto!important}
@media(max-width:420px){.hero h1{font-size:25px}.hero p{font-size:10.8px}.chip{padding:0 11px}.dock{left:8px;right:8px}.topbar{left:8px;right:8px}}
</style>
</head>
<body>
<div id="map"></div>
<header class="topbar">
  <img class="logo" src="icon-192.svg" alt="EPR" />
  <div class="brand"><strong>EPR Parks</strong><span>Find it • enjoy it • verify it</span></div>
  <button class="iconbtn" id="searchBtn" aria-label="Search parks">⌕</button>
  <button class="iconbtn" id="aboutBtn" aria-label="About">i</button>
</header>
<section class="hero" id="hero">
  <div class="eyebrow">Enid outdoors • Prototype A2</div>
  <h1>Find your outside.</h1>
  <p>Tell us what you want to do. We’ll show the parks—and the public record behind them.</p>
  <div class="quickrow">
    <button class="heroBtn primary" id="nearBtn">◎ Near me</button>
    <button class="heroBtn gold" id="surpriseBtn">✦ Surprise me</button>
    <button class="heroBtn ghost" id="collapseHero">Map first</button>
  </div>
</section>
<div class="filters" id="filters"></div>
<div class="floatstack">
  <button class="floatbtn" id="evidenceBtn" aria-label="Evidence lens" title="Evidence Lens">⌁</button>
  <button class="floatbtn" id="fitBtn" aria-label="Show all parks">⌖</button>
</div>
<div class="pulse" id="pulse"></div>
<section class="dock">
  <div class="dockTop">
    <div class="passport"><div class="label">My Park Passport • stored only on this device</div><strong id="passportText">0 of 9 explored</strong></div>
    <div class="progress"><i id="progressBar"></i></div>
  </div>
  <div class="dockBtns">
    <button class="dockBtn primary" id="browseBtn">Explore parks</button>
    <button class="dockBtn" id="passportBtn">Park Passport</button>
  </div>
</section>
<section class="sheet" id="sheet" aria-live="polite">
  <div class="handle"></div>
  <div id="sheetBody"></div>
</section>
<div class="modal" id="modal"><div class="modalCard" id="modalCard"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const parks=[
 {id:'crosslin',name:'Crosslin Park',address:'1520 W Oxford Ave',lat:36.43076809279516,lng:-97.89692999443014,emoji:'🌳',moods:['Play','Walk','Water','Sports','Picnic'],features:['Accessible','Lake or river','Playground','Paved walking trails','Sports area','Picnic tables','Toilets','Water fountains'],evidence:'Verified city-owned park site. EPR has exact current City parcel matches for mapped Crosslin property records.',source:'https://www.enid.org/Services/Parks-Recreation/Parks-Directory/Crosslin-Park'},
 {id:'meadowlake',name:'Meadowlake Park',address:'1200 W Rupe',lat:36.37325038375219,lng:-97.89503468414765,emoji:'🦆',moods:['Play','Walk','Water','Sports','Picnic','Quiet'],features:['Accessible','Lake or river','BBQ','Playground','Paved walking trails','Sports pavilion','Picnic tables','Toilets'],evidence:'Verified park site with a supported public-record parcel crosswalk. Facility footprint may differ from the containing parcel.',source:'https://www.enid.org/Services/Parks-Recreation/Parks-Directory/Meadowlake-Park'},
 {id:'hoover',name:'Hoover Park & Splash Pad',address:'3000 W Oklahoma Ave',lat:36.39315188058471,lng:-97.91573861396071,emoji:'💦',moods:['Play','Water','Picnic'],features:['Splash pad','Playground','Shade','Toilets','Water fountains','Youth activity area'],evidence:'Verified City park identity with an explicit GIS legal-name match and current City directory record.',source:'https://www.enid.org/Services/Parks-Recreation/Parks-Directory/Hoover-Park-and-Splash-Pad'},
 {id:'monsees',name:'Monsees BMX Bike Park',address:'1700 W James Ave',lat:36.398981190506845,lng:-97.89927796537965,emoji:'🚲',moods:['Play','Sports'],features:['BMX track','Playground','Shade','Youth activity area'],evidence:'Verified City park identity with an EPR parcel crosswalk.',source:'https://www.enid.org/Services/Parks-Recreation/Parks-Directory/Monsees-Park'},
 {id:'donhaskins',name:'Don Haskins Park',address:'515 E Maine St',lat:36.394872474246185,lng:-97.87097416737163,emoji:'🏀',moods:['Play','Sports','Picnic'],features:['Accessible','Paved sports area','Picnic tables','Shade','Toilets','Youth activity area'],evidence:'Verified site using the City address and a matching public GIS legal description for the recreational property.',source:'https://www.enid.org/Services/Parks-Recreation/Parks-Directory/Don-Haskins-Park'},
 {id:'govnorth',name:'Government Springs — North',address:'509 E Oklahoma Ave',lat:36.39178,lng:-97.87072,emoji:'🌿',moods:['Play','Walk','Water','Picnic','Quiet'],features:['Accessible','BBQ','Lake or river','Playground','Rotunda','Paved walking trails','Picnic tables','Toilets'],evidence:'Verified park site. EPR has a supported exact-current City parcel anchor; the anchor is not asserted to equal the full park footprint.',source:'https://www.enid.org/Services/Parks-Recreation/Parks-Directory/Government-Springs-North'},
 {id:'govsouth',name:'Government Springs — South',address:'600 E Owen K Garriott Rd',lat:36.3869,lng:-97.86606,emoji:'🎾',moods:['Sports','Picnic','Quiet'],features:['Picnic tables','Shade','Grassed sports area','Paved sports area','Toilets','Water fountains'],evidence:'Verified park site. The linked City parcel is used as a location anchor; EPR does not equate the entire parcel with the park footprint.',source:'https://www.enid.org/Services/Parks-Recreation/Parks-Directory/Government-Springs-South'},
 {id:'glenwood',name:'Glenwood Park',address:'1800 E Randolph Ave',lat:36.398196208077906,lng:-97.85206757892824,emoji:'🛝',moods:['Play','Picnic','Quiet'],features:['Accessible','Playground','Picnic tables','Shade','Toilets'],evidence:'Verified City park identity with address and public GIS legal-name support.',source:'https://www.enid.org/Services/Parks-Recreation/Parks-Directory/Glenwood-Park'},
 {id:'exchange',name:'Exchange Park',address:'310 E Maple Ave',lat:36.39958049075263,lng:-97.87322014935623,emoji:'⚾',moods:['Play','Sports'],features:['Playground','Grassed sports area','Toilets'],evidence:'Verified City park location in the EPR asset map. Public-facing parcel detail should remain tied to the underlying source record.',source:'https://www.enid.org/Services/Parks-Recreation/Parks-Directory/Exchange-Park'}
];
const featureIcons={Accessible:'♿','Lake or river':'≈','Playground':'🛝','Paved walking trails':'🚶','Sports area':'⚾','Picnic tables':'🧺','Toilets':'🚻','Water fountains':'⛲','BBQ':'♨','Sports pavilion':'🏟','Splash pad':'💦','Shade':'🌳','Youth activity area':'★','BMX track':'🚲','Paved sports area':'🏀','Rotunda':'◉','Grassed sports area':'⚽'};
const moods=[['All','✦'],['Play','🛝'],['Walk','🚶'],['Water','💧'],['Sports','⚽'],['Picnic','🧺'],['Quiet','🌿']];
let filter='All', evidence=false, userMarker=null, map, markerGroup, markers=new Map();
const visited=new Set(JSON.parse(localStorage.getItem('epr-parks-visited')||'[]'));
function toast(msg){const el=document.getElementById('pulse');el.textContent=msg;el.classList.add('show');clearTimeout(window.__pt);window.__pt=setTimeout(()=>el.classList.remove('show'),1800)}
function initMap(){
 if(!window.L){toast('Map unavailable — the prototype UI still works.'); return;}
 map=L.map('map',{zoomControl:false,attributionControl:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false,preferCanvas:true}).setView([36.397,-97.885],12.9);
 let tileErrors=0, switched=false;
 const carto=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,keepBuffer:8,updateWhenIdle:false,updateWhenZooming:false,crossOrigin:true,attribution:'© OpenStreetMap contributors © CARTO'});
 const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,keepBuffer:8,updateWhenIdle:false,crossOrigin:true,attribution:'© OpenStreetMap contributors'});
 carto.on('tileerror',()=>{tileErrors++; if(tileErrors>=4&&!switched){switched=true; try{map.removeLayer(carto)}catch(e){} osm.addTo(map); toast('Switched map source for this preview.'); setTimeout(()=>{map.invalidateSize(true); osm.redraw();},120);}});
 carto.addTo(map);
 markerGroup=L.layerGroup().addTo(map); renderMarkers();
 const repair=()=>{if(!map)return;map.invalidateSize(true); if(map.eachLayer)map.eachLayer(l=>{if(l.redraw)try{l.redraw()}catch(e){}})};
 requestAnimationFrame(repair); setTimeout(repair,180); setTimeout(repair,700); setTimeout(repair,1600);
 window.addEventListener('resize',()=>setTimeout(repair,120),{passive:true});
 if(window.visualViewport) visualViewport.addEventListener('resize',()=>setTimeout(repair,120),{passive:true});
}
function iconFor(p){return L.divIcon({className:'',html:`<div class="parkpin ${evidence?'evidence':''}"><span>${p.emoji}</span></div>`,iconSize:[34,34],iconAnchor:[17,31],tooltipAnchor:[0,-30]})}
function renderMarkers(){if(!markerGroup)return;markerGroup.clearLayers();markers.clear();filteredParks().forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:iconFor(p)}).addTo(markerGroup);m.bindTooltip(p.name,{direction:'top',offset:[0,-2]});m.on('click',()=>openPark(p));markers.set(p.id,m);});}
function filteredParks(){return filter==='All'?parks:parks.filter(p=>p.moods.includes(filter))}
function renderFilters(){const el=document.getElementById('filters');el.innerHTML=moods.map(([m,e])=>`<button class="chip ${m===filter?'active':''}" data-mood="${m}"><span class="em">${e}</span>${m}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.mood;renderFilters();renderMarkers();toast(`${filteredParks().length} park${filteredParks().length===1?'':'s'} match ${filter.toLowerCase()}`)})}
function openPark(p){
 const feats=p.features.slice(0,8).map(f=>`<div class="feature"><span>${featureIcons[f]||'•'}</span><strong>${f}</strong></div>`).join('');
 const isVisited=visited.has(p.id);
 document.getElementById('sheetBody').innerHTML=`<div class="sheetHead"><div class="copy"><div class="kicker">${evidence?'Evidence Lens on':'Park Explorer'}</div><h2>${p.name}</h2><div class="addr">${p.address} • Enid, Oklahoma</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="tagrow">${p.moods.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="featureGrid">${feats}</div>${evidence?`<div class="record"><div class="recordTop"><span>⌁</span><b>Public-record check</b></div><p>${p.evidence}</p></div>`:''}<div class="sheetActions"><button class="sheetBtn primary" onclick="directions('${p.id}')">Directions</button><button class="sheetBtn ${isVisited?'visited':''}" id="visit-${p.id}" onclick="toggleVisited('${p.id}')">${isVisited?'✓ Explored':'Mark explored'}</button><button class="sheetBtn" onclick="window.open('${p.source}','_blank','noopener')">Source</button></div>`;
 document.getElementById('sheet').classList.add('open');
 if(map){map.flyTo([p.lat,p.lng],15,{duration:.7});setTimeout(()=>map.panBy([0,-120]),300)}
}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function toggleVisited(id){visited.has(id)?visited.delete(id):visited.add(id);localStorage.setItem('epr-parks-visited',JSON.stringify([...visited]));updatePassport();const p=parks.find(x=>x.id===id);openPark(p);toast(visited.has(id)?'Added to your Park Passport':'Removed from Park Passport')}
function updatePassport(){document.getElementById('passportText').textContent=`${visited.size} of ${parks.length} explored`;document.getElementById('progressBar').style.width=`${Math.round(visited.size/parks.length*100)}%`}
function directions(id){const p=parks.find(x=>x.id===id);window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.lat+','+p.lng)}`,'_blank','noopener')}
function showBrowse(passportOnly=false){const list=(passportOnly?parks.filter(p=>visited.has(p.id)):filteredParks());document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div style="display:flex;align-items:start;gap:8px"><div style="flex:1"><div class="eyebrow" style="color:#738078;opacity:1">${passportOnly?'My Park Passport':'Browse'}</div><h2>${passportOnly?'Places I’ve explored':'Choose your next park'}</h2><p>${passportOnly?'Your visit list stays in this browser on this device.':'Nine verified park locations are loaded in this first prototype.'}</p></div><button class="close" onclick="closeModal()">×</button></div>${passportOnly?'':`<div class="search"><input id="parkSearch" placeholder="Search parks or activities" /><button class="dockBtn primary" style="width:82px" onclick="renderParkList()">Find</button></div>`}<div class="parklist" id="parkList"></div><div class="note">Prototype scope: this A2 build showcases a subset of Enid parks already tied to EPR’s verified map records. It does not yet represent the full City parks/recreation directory.</div>`;document.getElementById('modal').classList.add('open');renderParkList(passportOnly)}
function renderParkList(passportOnly=false){const q=(document.getElementById('parkSearch')?.value||'').trim().toLowerCase();let list=passportOnly?parks.filter(p=>visited.has(p.id)):filteredParks().filter(p=>!q||[p.name,p.address,...p.features,...p.moods].join(' ').toLowerCase().includes(q));const el=document.getElementById('parkList');if(!el)return;el.innerHTML=list.length?list.map(p=>`<div class="parkrow"><div class="dot">${p.emoji}</div><div class="pcopy"><strong>${p.name}</strong><small>${p.moods.slice(0,4).join(' • ')}</small></div><button onclick="closeModal();openPark(parks.find(x=>x.id==='${p.id}'))">Open</button></div>`).join(''):`<div class="parkrow"><div class="pcopy"><strong>No parks here yet.</strong><small>${passportOnly?'Mark a park as explored to start your Passport.':'Try another search or activity.'}</small></div></div>`}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function showAbout(){document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div style="display:flex;gap:8px;align-items:start"><div style="flex:1"><div class="eyebrow" style="color:#738078;opacity:1">Prototype A2</div><h2>A parks app with receipts.</h2></div><button class="close" onclick="closeModal()">×</button></div><p>EPR Parks is designed to answer two questions at once: <b>“What can I do nearby?”</b> and <b>“What does the public record actually verify?”</b></p><div class="record"><div class="recordTop"><span>⌁</span><b>Evidence Lens</b></div><p>Turn it on to surface plain-language ownership and mapping notes beside the recreation information. Public-facing evidence stays concise; internal research workflow stays private.</p></div><div class="record" style="background:#eef6ef;border-color:#d3e6d6"><div class="recordTop"><span>✓</span><b>Privacy-first Park Passport</b></div><p>Visited parks are stored locally on the device. No account is needed in this prototype.</p></div><p class="note">Independent EPR prototype. Not an official City of Enid app. This A2 file also includes phone-preview fixes; the hosted build will use the same interface with full app assets.</p>`;document.getElementById('modal').classList.add('open')}
function locate(){if(!navigator.geolocation){toast('Location is not available in this browser.');return}navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];if(map){if(userMarker)userMarker.remove();userMarker=L.circleMarker(ll,{radius:8,weight:3,color:'#153e2d',fillColor:'#f1c55f',fillOpacity:1}).addTo(map).bindTooltip('You are here');map.flyTo(ll,14)}toast('Location found — tap a park to explore.')},()=>toast('Location permission was not granted.'),{enableHighAccuracy:true,timeout:10000})}
function surprise(){const list=filteredParks();const p=list[Math.floor(Math.random()*list.length)];openPark(p);toast(`Try ${p.name}`)}
function fitAll(){if(!map)return;const list=filteredParks();map.fitBounds(L.latLngBounds(list.map(p=>[p.lat,p.lng])).pad(.14),{paddingTopLeft:[25,240],paddingBottomRight:[25,160]})}
function toggleEvidence(){evidence=!evidence;document.getElementById('evidenceBtn').classList.toggle('active',evidence);renderMarkers();toast(evidence?'Evidence Lens on':'Evidence Lens off');if(document.getElementById('sheet').classList.contains('open'))closeSheet()}
function collapseHero(){const h=document.getElementById('hero'),f=document.getElementById('filters');const hidden=h.dataset.hidden==='1';h.dataset.hidden=hidden?'0':'1';h.style.transform=hidden?'translateY(0)':'translateY(-190px)';f.style.top=hidden?'calc(var(--safe-top) + 245px)':'calc(var(--safe-top) + 70px)';document.getElementById('collapseHero').textContent=hidden?'Map first':'Show intro'}
document.getElementById('nearBtn').onclick=locate;document.getElementById('surpriseBtn').onclick=surprise;document.getElementById('collapseHero').onclick=collapseHero;document.getElementById('evidenceBtn').onclick=toggleEvidence;document.getElementById('fitBtn').onclick=fitAll;document.getElementById('browseBtn').onclick=()=>showBrowse(false);document.getElementById('passportBtn').onclick=()=>showBrowse(true);document.getElementById('searchBtn').onclick=()=>showBrowse(false);document.getElementById('aboutBtn').onclick=showAbout;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
renderFilters();updatePassport();initMap();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
