<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Refresh Explore Enid</title></head><body><p>Refreshing Explore Enid…</p><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/explore/')).map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('epr-explore-')&&!k.startsWith('epr-explore-test-')).map(k=>caches.delete(k)));}}catch(e){}location.replace('/explore/?fresh=2.2-approved');})();</script></body></html>
