function openGuide(id,idx=0){stopNarration();const g=guideData[id],p=parks.find(x=>x.id===id);if(!g||!p){toast('This park does not have an Archie guide yet.');return}idx=Math.max(0,Math.min(g.stops.length-1,Number(idx)||0));guideParkId=id;guideStopIndex=idx;const st=g.stops[idx],seen=guideSeen.has(`${id}:${idx}`);document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div class="guideHero"><div class="guideHeroTop"><div class="archie">🦉</div><div style="min-width:0;flex:1"><div class="eyebrow">Archie’s Guide · stop ${idx+1} of ${g.stops.length}</div><h2>${st.title}</h2><p>${p.name} · ${g.subtitle}</p></div><button class="close" style="background:rgba(255,255,255,.14);color:#fff" onclick="closeModal();stopNarration()">×</button></div><div class="stopProgress">${g.stops.map((_,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div></div><div class="guideStory">${st.text}</div><div class="voiceRow"><label>ARCHIE VOICE</label><select id="guideVoice"><option>Device voice</option></select></div><div class="guideControls"><button class="guideBtn primary" onclick="speakGuide('${id}',${idx})">▶ Hear this stop</button><button class="guideBtn" onclick="stopNarration()">■ Stop</button></div><div class="guideNav"><button class="guideBtn" ${idx===0?'disabled':''} onclick="openGuide('${id}',${idx-1})">← Previous</button><button class="guideBtn ${seen?'gold':''}" onclick="markGuideSeen('${id}',${idx})">${seen?'✓ Saved':'Save stop'}</button><button class="guideBtn" ${idx===g.stops.length-1?'disabled':''} onclick="openGuide('${id}',${idx+1})">Next →</button></div><div class="guideNav"><button class="guideBtn" onclick="showGuideQR('${id}',${idx})">▦ QR / link</button><button class="guideBtn" onclick="closeModal();openPark(parks.find(x=>x.id==='${id}'))">Park card</button><button class="guideBtn" onclick="directions('${id}')">Directions</button></div><div class="note">Guide facts are intentionally concise. Use the park card and Evidence Lens for source-backed detail. Physical signage is not required for this guide to work.</div>`;document.getElementById('modal').classList.add('open');loadVoices();if(map){map.flyTo([p.lat,p.lng],15,{duration:.55})}}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Guide link copied')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Guide link copied')}}
function showGuideQR(id,idx){stopNarration();const g=guideData[id],p=parks.find(x=>x.id===id),url=guideUrl(id,idx);document.getElementById('modalCard').innerHTML=`<div class="handle"></div><div style="display:flex;gap:8px;align-items:start"><div style="flex:1"><div class="eyebrow" style="color:#738078;opacity:1">QR-ready stop</div><h2>${p.name}</h2><p>${g.stops[idx].title} · stop ${idx+1}</p></div><button class="close" onclick="openGuide('${id}',${idx})">×</button></div><div class="qrWrap"><div class="qrCard"><canvas id="guideQR" width="220" height="220"></canvas></div></div><div class="urlBox">${url}</div><div class="guideControls"><button class="guideBtn primary" onclick="copyText(${JSON.stringify('URLTOKEN')})">Copy stop link</button><button class="guideBtn" onclick="shareGuide('${id}',${idx})">Share</button></div><div class="digitalOnly"><b>No sign required.</b> This QR can live on EPR’s website, a printable guide, social graphic, event handout, or—only with permission—a future physical marker.</div>`;document.getElementById('modal').classList.add('open');const btn=document.querySelector('.guideControls .guideBtn.primary');if(btn)btn.onclick=()=>copyText(url);const c=document.getElementById('guideQR');if(window.QRCode?.toCanvas){QRCode.toCanvas(c,url,{width:220,margin:1,color:{dark:'#123328',light:'#ffffff'}},err=>{if(err)qrFallback(c,url)})}else qrFallback(c,url)}
function qrFallback(c,url){const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,220,220);x.fillStyle='#123328';x.font='700 15px system-ui';x.textAlign='center';x.fillText('QR library unavailable',110,96);x.font='12px system-ui';x.fillText('Use Copy stop link',110,120);}
async function shareGuide(id,idx){const p=parks.find(x=>x.id===id),url=guideUrl(id,idx);if(navigator.share){try{await navigator.share({title:`${p.name} · Archie’s Guide`,text:'Open this EPR Parks guide stop.',url});return}catch(e){}}copyText(url)}
function openDeepGuide(){const q=new URLSearchParams(location.search),id=q.get('guide');if(!id||!guideData[id])return;let n=parseInt(q.get('stop')||'1',10);if(!Number.isFinite(n))n=1;setTimeout(()=>openGuide(id,n-1),850)}

function locate(){if(!navigator.geolocation){toast('Location is not available in this browser.');return}navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];if(map){if(userMarker)userMarker.remove();userMarker=L.circleMarker(ll,{radius:8,weight:3,color:'#153e2d',fillColor:'#f1c55f',fillOpacity:1}).addTo(map).bindTooltip('You are here');map.flyTo(ll,14)}toast('Location found — tap a park to explore.')},()=>toast('Location permission was not granted.'),{enableHighAccuracy:true,timeout:10000})}
function surprise(){const list=filteredParks();const p=list[Math.floor(Math.random()*list.length)];openPark(p);toast(`Try ${p.name}`)}
function fitAll(){if(!map)return;const list=filteredParks();map.fitBounds(L.latLngBounds(list.map(p=>[p.lat,p.lng])).pad(.14),{paddingTopLeft:[25,240],paddingBottomRight:[25,160]})}
function toggleEvidence(){evidence=!evidence;document.getElementById('evidenceBtn').classList.toggle('active',evidence);renderMarkers();toast(evidence?'Evidence Lens on':'Evidence Lens off');if(document.getElementById('sheet').classList.contains('open'))closeSheet()}
function collapseHero(){const h=document.getElementById('hero'),f=document.getElementById('filters');const hidden=h.dataset.hidden==='1';h.dataset.hidden=hidden?'0':'1';h.style.transform=hidden?'translateY(0)':'translateY(-190px)';f.style.top=hidden?'calc(var(--safe-top) + 245px)':'calc(var(--safe-top) + 70px)';document.getElementById('collapseHero').textContent=hidden?'Map first':'Show intro'}
document.getElementById('nearBtn').onclick=locate;document.getElementById('guideBtn').onclick=openGuideHub;document.getElementById('surpriseBtn').onclick=surprise;document.getElementById('collapseHero').onclick=collapseHero;document.getElementById('evidenceBtn').onclick=toggleEvidence;document.getElementById('fitBtn').onclick=fitAll;document.getElementById('browseBtn').onclick=()=>showBrowse(false);document.getElementById('passportBtn').onclick=()=>showBrowse(true);document.getElementById('searchBtn').onclick=()=>showBrowse(false);document.getElementById('aboutBtn').onclick=showAbout;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
renderFilters();updatePassport();initMap();openDeepGuide();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
